<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vida Samambaia — Gestão de Água</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%230891b2' d='M12 2C12 2 5 10 5 15a7 7 0 0 0 14 0c0-5-7-13-7-13z'/%3E%3C/svg%3E">
</head>
<body>
<div class="layout">
  <!-- Sidebar (desktop) -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <img src="img/vidasamambaia.jpg" alt="" style="height:30px;width:auto;border-radius:8px;">
      <div>
        <div class="b-title">Vida<br>Samambaia</div>
        <div class="b-sub" id="condo-label">Condomínio</div>
      </div>
      <div style="padding:10px 0 0;width:100%;display:flex;align-items:center;gap:8px;">
        <img id="condo-logo" alt="Logo do condomínio" class="condo-logo" style="width:30px;height:30px;border-radius:8px;"
             src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%230891b2' d='M12 2C12 2 5 10 5 15a7 7 0 0 0 14 0c0-5-7-13-7-13z'/%3E%3C/svg%3E">
        <select id="condo-select" style="width:100%;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:7px 8px;font-size:12px;font-weight:600;"></select>
      </div>
    </div>
    <nav class="sidebar-nav" id="side-nav">
      <button class="nav-item" data-view="dashboard">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        Dashboard
      </button>
      <button class="nav-item" data-view="lancamento">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        Lançamento Mensal
      </button>
      <button class="nav-item" data-view="diaria">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="m9 16 2 2 4-4"/></svg>
        Medição diária
      </button>
      <button class="nav-item" data-view="historico">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 14 4-4 4 3 5-6"/></svg>
        Histórico e Relatórios
      </button>
      <button class="nav-item" data-view="iniciais">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
        Medição Inicial
      </button>
      <button class="nav-item" data-view="configuracoes">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Configurações
      </button>
      <button class="nav-item" data-view="condominios">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-4"/><path d="M9 9v.01M9 12v.01M9 15v.01M9 18v.01"/></svg>
        Condomínios
      </button>
      <button class="nav-item" data-view="usuarios" data-admin-only style="display:none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Usuários
      </button>
    </nav>
    <div class="sidebar-user">
      <span class="u-name" id="user-name">—</span>
      <span class="u-role" id="user-role">Administrador</span>
      <button class="logout-btn" id="logout-btn">Sair</button>
    </div>
  </aside>

  <div class="main">
    <!-- Topbar (mobile) -->
    <header class="topbar">
      <img id="condo-logo-m" alt="Logo do condomínio" class="condo-logo-m"
           src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%2322d3ee' d='M12 2C12 2 5 10 5 15a7 7 0 0 0 14 0c0-5-7-13-7-13z'/%3E%3C/svg%3E">
      <span class="t-title">Vida Samambaia</span>
      <button class="logout-btn" style="width:auto;margin:0;padding:6px 12px;" id="logout-btn-m">Sair</button>
    </header>
    <nav class="mobile-nav" id="mobile-nav">
      <button class="nav-item" data-view="dashboard">Dashboard</button>
      <button class="nav-item" data-view="lancamento">Lançamento</button>
      <button class="nav-item" data-view="diaria">Diária</button>
      <button class="nav-item" data-view="historico">Histórico</button>
      <button class="nav-item" data-view="iniciais">Inicial</button>
      <button class="nav-item" data-view="configuracoes">Ajustes</button>
      <button class="nav-item" data-view="condominios">Condomínios</button>
      <button class="nav-item" data-view="usuarios" data-admin-only style="display:none;">Usuários</button>
    </nav>

    <main class="content" id="view"><!-- renderizado por app.js --></main>
  </div>
</div>
<script src="/js/common.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
