<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Vida Samambaia</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%230891b2' d='M12 2C12 2 5 10 5 15a7 7 0 0 0 14 0c0-5-7-13-7-13z'/%3E%3C/svg%3E">
</head>
<body class="login-body">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <img id="login-logo" alt="Vida Samambaia" style="width:170px;height:76px;object-fit:contain;border-radius:14px;"
             src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 300' width='300' height='300'%3E%3Crect width='300' height='300' rx='42' fill='%230c2740'/%3E%3Cpath d='M150 44c0 0-56 70-56 128a56 56 0 0 0 112 0c0-58-56-128-56-128z' fill='%230891b2'/%3E%3Cpath d='M126 168c0 19 12 35 28 42a40 40 0 0 1-34-39c0-22 16-46 26-64-14 16-20 38-20 61z' fill='%23cffafe' opacity='.8'/%3E%3C/svg%3E">
      </div>
      <h1 style="font-size:22px;">Vida Samambaia</h1>
      <p class="login-sub">Gestão de água — leituras, rateio e relatórios</p>

      <form id="login-form" autocomplete="off">
        <label for="username">Usuário</label>
        <input type="text" id="username" name="username" required autofocus>

        <label for="password">Senha</label>
        <div class="senha-wrap">
          <input type="password" id="password" name="password" required placeholder="••••••••">
          <button type="button" class="olho" data-alvo="password" aria-label="Mostrar/ocultar senha">👁️</button>
        </div>

        <div id="login-error" class="login-error" hidden></div>

        <button type="submit" class="btn btn-primary btn-block" id="login-btn">Entrar</button>
      </form>

      <div class="login-hint">
        Use as credenciais fornecidas pela administração do seu condomínio.<br>
        Primeiro acesso? O sistema pedirá para criar uma nova senha.
      </div>
    </div>
    <p class="login-footer">Medição mensal multi-condomínio · tarifas CAESB · leitura com registro fotográfico</p>
  </div>
  <script src="/js/login.js"></script>
</body>
</html>
