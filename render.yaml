# Render Blueprint — Vida Samambaia (plataforma gêmea do ORION).
# No Render: New + → Blueprint → aponte para este arquivo no GitHub.
# Depois cole as variáveis TURSO_DATABASE_URL e TURSO_AUTH_TOKEN (Environment).
services:
  - type: web
    name: agua-vidasamambaia
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_GESTOR
        value: "0"
      - key: ADMIN_PASSWORD
        sync: false   # defina no painel do Render (senha do admin)
      - key: TURSO_DATABASE_URL
        sync: false   # ex.: libsql://seu-banco-xxxx.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false
